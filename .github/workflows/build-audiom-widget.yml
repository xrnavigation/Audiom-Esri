name: Build & Publish Audiom Widget

# Requirement 3: only run on pushes to main/master.
# Requirement 2: only build when the `audiom` widget itself changed. Scoping the
# trigger to the widget's source folder means the workflow runs *if and only if*
# the Audiom widget was modified. (Docs commits made by this workflow touch only
# `docs/**`, so they never re-trigger it.)
on:
  push:
    branches: [main, master]
    paths:
    - 'ArcGIS/client/your-extensions/widgets/audiom/**'
  workflow_dispatch:


# Least privilege by default; the publish job elevates to `write` where needed.
permissions:
  contents: read

# Serialize runs on the same branch so the docs-publishing commit never races.
concurrency:
  group: build-audiom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Audiom (ExB ${{ matrix.exb-version }})
    runs-on: ubuntu-latest
    strategy:
      # Build every version independently; one failure shouldn't cancel the rest.
      fail-fast: false
      matrix:
        # =====================================================================
        # Add or remove an entry to build for that release, setting
        # `node-version` to the recommended Node.js major from Esri's table:
        # https://developers.arcgis.com/experience-builder/guide/release-versions/
        # The docs folder `docs/builder-versions/<exb-version>/audiom` is derived
        # from `exb-version`.
        # =====================================================================
        include:
        - exb-version: '1.18'
          node-version: '22'
        - exb-version: '1.19'
          node-version: '22'
        - exb-version: '1.20'
          node-version: '24'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies for setup scripts
      run: pip install requests

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # Use the project script to pull the right ExB version.
    # This preserves `your-extensions` (the Audiom widget) while replacing the
    # rest of the Experience Builder client/server with the requested release.
    - name: Download & extract Experience Builder ${{ matrix.exb-version }}
      run: python utils/setup_arcgis.py '${{ matrix.exb-version }}'

    # The build tooling copies the manifest verbatim (aside from computed
    # `properties`), so stamp the target version to keep each published build's
    # `exbVersion` accurate.
    - name: Stamp widget manifest with target ExB version
      run: |
        MANIFEST="ArcGIS/client/your-extensions/widgets/audiom/manifest.json"
        tmp="$(mktemp)"
        jq --arg v '${{ matrix.exb-version }}' '.exbVersion = $v' "$MANIFEST" > "$tmp"
        mv "$tmp" "$MANIFEST"

    # Install dependencies for both the client and the server.
    - name: Install client dependencies
      working-directory: ArcGIS/client
      run: npm ci

    - name: Install server dependencies
      working-directory: ArcGIS/server
      run: npm ci

    # Produce the production build of the widget.
    - name: Build Audiom widget (production)
      working-directory: ArcGIS/client
      run: npm run build:prod

    - name: Verify build output
      run: |
        OUT="ArcGIS/client/dist/widgets/audiom"
        # Fail the build if any essential file is missing or empty (an empty build).
        for f in "manifest.json" "dist/runtime/widget.js" "dist/setting/setting.js"; do
          if [ ! -s "$OUT/$f" ]; then
            echo "::error::Missing or empty build output: $OUT/$f" >&2
            ls -laR "$OUT" 2>/dev/null || ls -la ArcGIS/client/dist/widgets || true
            exit 1
          fi
        done
        # Fail the build if the manifest wasn't stamped with the target version.
        built="$(jq -r '.exbVersion' "$OUT/manifest.json")"
        if [ "$built" != "${{ matrix.exb-version }}" ]; then
          echo "::error::Built manifest exbVersion is '$built', expected '${{ matrix.exb-version }}'" >&2
          exit 1
        fi

    # Upload each version's build as an artifact; fail if there are no files.
    - name: Upload built widget artifact
      uses: actions/upload-artifact@v4
      with:
        name: audiom-${{ matrix.exb-version }}
        path: ArcGIS/client/dist/widgets/audiom
        if-no-files-found: error

  publish-docs:
    name: Publish builds to docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Check out the branch tip (not the detached trigger SHA) so we can commit
    # and push the documentation update back to it.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    # Download every version's build artifact.
    - name: Download all widget build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: audiom-*

    # Fail if nothing was uploaded, or any artifact is empty / stamped wrong.
    - name: Verify downloaded artifacts
      run: |
        shopt -s nullglob
        dirs=(artifacts/audiom-*/)
        if [ ${#dirs[@]} -eq 0 ]; then
          echo "::error::No build artifacts were downloaded; nothing was uploaded to publish." >&2
          exit 1
        fi
        for dir in "${dirs[@]}"; do
          version="$(basename "$dir")"
          version="${version#audiom-}"
          if [ ! -s "${dir}manifest.json" ] || [ ! -s "${dir}dist/runtime/widget.js" ]; then
            echo "::error::Artifact '${dir}' is empty or incomplete." >&2
            ls -laR "${dir}" || true
            exit 1
          fi
          mver="$(jq -r '.exbVersion' "${dir}manifest.json")"
          if [ "${mver}" != "${version}" ]; then
            echo "::error::Artifact '${dir}' manifest exbVersion '${mver}' != '${version}'." >&2
            exit 1
          fi
        done
        echo "Verified ${#dirs[@]} artifact(s)."

    # Map each `audiom-<version>` artifact into its versioned docs folder.
    - name: Copy builds into docs
      run: |
        shopt -s nullglob
        for dir in artifacts/audiom-*/; do
          version="$(basename "$dir")"
          version="${version#audiom-}"
          target="docs/builder-versions/${version}/audiom"
          echo "Updating ${target} from ${dir}"
          rm -rf "$target"
          mkdir -p "$target"
          cp -R "${dir}." "$target/"
        done

    # Commit the refreshed builds and push the commit.
    - name: Commit and push documentation updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/builder-versions
        if git diff --cached --quiet; then
          echo "No documentation changes to commit."
        else
          git commit -m "docs: Update Audiom widget builds."
          git push
        fi
