name: Build & Publish Audiom Widget

# Requirement 3: only run on pushes to main/master.
# Requirement 2: only build when the `audiom` widget itself changed. Scoping the
# trigger to the widget's source folder means the workflow runs *if and only if*
# the Audiom widget was modified. (Docs commits made by this workflow touch only
# `docs/**`, so they never re-trigger it.)
on:
  push:
    branches: [main, master]
    paths:
    - 'ArcGIS/client/your-extensions/widgets/audiom/**'
    - 'ArcGIS/client/your-extensions/shared/audiom-runtime/**'
    - '.github/workflows/build-audiom-widget.yaml'
    - 'utils/setup_arcgis.py'
    - '.github/scripts/verify-build-output.sh'
    - '.github/scripts/tests/test-scripts.sh'
  workflow_dispatch:


# Least privilege by default; the publish job elevates to `write` where needed.
permissions:
  contents: read

# =====================================================================
# Audiom base URL rewrite. Before every build the widget source has all
# occurrences of AUDIOM_ORIGINAL_URL replaced with AUDIOM_REPLACEMENT_URL.
# Edit these two values to change the search/replacement URLs.
# =====================================================================
env:
  AUDIOM_ORIGINAL_URL: 'https://audiom-staging.herokuapp.com'
  AUDIOM_REPLACEMENT_URL: 'https://audiom.net'
  # Front-End checkout inside this workspace. The widget require cannot walk
  # outside $GITHUB_WORKSPACE, so the overlay aliases a module id to this path.
  AUDIOM_FRONTEND_ROOT: ${{ github.workspace }}/Audiom-Front-End
  # feature/1977-use-map-viewer. Bump the SHA on purpose. A Front-End push
  # does not rebuild the widget.
  AUDIOM_FRONTEND_SHA: 9e8782e438dd31c8a1b99435bcb37b3670cbe3ac
  # Absolute path to the workflow helper scripts, anchored to the repo root so
  # every step calls the same location regardless of its working directory.
  SCRIPTS_DIR: ${{ github.workspace }}/.github/scripts

# Serialize runs on the same branch so the docs-publishing commit never races.
concurrency:
  group: build-audiom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Audiom (ExB ${{ matrix.exb-version }})
    runs-on: ubuntu-latest
    strategy:
      # Build every version independently; one failure shouldn't cancel the rest.
      fail-fast: false
      matrix:
        # Bundled mode compiles the Front-End program. 1.18 is React 18
        # (Enterprise 12.0). 1.20 is React 19 (Enterprise 12.1). Older
        # versions stay on the embed zips already published under
        # docs/builder-versions until this graph is proven there.
        include:
        - exb-version: '1.18'
          node-version: '22'
        - exb-version: '1.20'
          node-version: '24'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Require Front-End checkout token
      env:
        AUDIOM_FRONTEND_TOKEN: ${{ secrets.AUDIOM_FRONTEND_TOKEN }}
      run: |
        if [ -z "$AUDIOM_FRONTEND_TOKEN" ]; then
          echo "::error::Set AUDIOM_FRONTEND_TOKEN. It must read Coughlan-Lab/Audiom-Front-End and packages in @xrnavigation."
          exit 1
        fi

    - name: Checkout Audiom Front-End
      uses: actions/checkout@v4
      with:
        repository: Coughlan-Lab/Audiom-Front-End
        ref: ${{ env.AUDIOM_FRONTEND_SHA }}
        path: Audiom-Front-End
        token: ${{ secrets.AUDIOM_FRONTEND_TOKEN }}

    # Front-End's only file: dependency is ../Audiom-Runtime. The vendored
    # contract in this repo is that package. Webpack compiles its src.
    - name: Link vendored runtime for Front-End install
      run: |
        rm -rf Audiom-Runtime
        cp -a ArcGIS/client/your-extensions/shared/audiom-runtime Audiom-Runtime
        test -f Audiom-Runtime/package.json
        test -f Audiom-Runtime/src/factory.ts

    - name: Set up Node.js 22 for Front-End install
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Audiom Front-End dependencies
      working-directory: Audiom-Front-End
      env:
        NPM_TOKEN: ${{ secrets.AUDIOM_FRONTEND_TOKEN }}
      run: npm ci

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies for setup scripts
      run: pip install requests

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # Use the project script to pull the right ExB version.
    # This preserves `your-extensions` (the Audiom widget) while replacing the
    # rest of the Experience Builder client/server with the requested release.
    - name: Download & extract Experience Builder ${{ matrix.exb-version }}
      run: python utils/setup_arcgis.py '${{ matrix.exb-version }}'

    # The build tooling copies the manifest verbatim (aside from computed
    # `properties`), so stamp the target version to keep each published build's
    # `exbVersion` accurate.
    - name: Stamp widget manifest with target ExB version
      run: bash "$SCRIPTS_DIR/stamp-manifest.sh" "ArcGIS/client/your-extensions/widgets/audiom/manifest.json" "${{ matrix.exb-version }}"

    # Rewrite the Audiom base URL (staging -> production) across the widget source
    # before building. URLs come from the top-level `env` block; --require-match
    # fails the build if the original URL is not found (so it can't silently skip).
    - name: Rewrite Audiom base URL for production
      run: python "$SCRIPTS_DIR/rewrite-url.py" "ArcGIS/client/your-extensions" --require-match

    # Experience Builder installs a widget lockfile during extension bootstrap.
    # Authenticate the @xrnavigation scope with this repository's own token.
    - name: Install widget dependencies
      working-directory: ArcGIS/client/your-extensions/widgets/audiom
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: npm ci

    # Developer Edition 1.18+ emits the downloadable widget, including lazy
    # import() chunks, with build:for-download. Older releases keep build:prod.
    # build:for-download writes dist-download. Older build:prod writes dist
    # or dist-prod. Lazy chunks live beside the widget folder.
    - name: Build Audiom widget
      working-directory: ArcGIS/client
      run: |
        if npm run | grep -q 'build:for-download'; then
          npm run build:for-download
        else
          npm run build:prod
        fi

    - name: Locate widget build output
      id: widget-out
      run: |
        OUT="$(bash "$SCRIPTS_DIR/resolve-widget-output.sh" "ArcGIS/client")"
        echo "Found widget output at $OUT"
        echo "path=$OUT" >> "$GITHUB_OUTPUT"
        CHUNKS="$(dirname "$OUT")/../chunks"
        if [ -d "$CHUNKS" ]; then
          mkdir -p "$OUT/chunks"
          cp -R "$CHUNKS/." "$OUT/chunks/"
        fi

    # Verify files are non-empty, the manifest is stamped, and the original
    # (staging) URL did not leak into the production bundle. The size gate runs
    # only when the runtime package has emitted its tree-shaking report.
    - name: Verify build output
      run: |
        REPORT="ArcGIS/client/your-extensions/widgets/audiom/treeshake-report.json"
        if [ -s "$REPORT" ]; then
          bash "$SCRIPTS_DIR/verify-build-output.sh" "${{ steps.widget-out.outputs.path }}" "${{ matrix.exb-version }}" "$AUDIOM_ORIGINAL_URL" "$REPORT"
        else
          bash "$SCRIPTS_DIR/verify-build-output.sh" "${{ steps.widget-out.outputs.path }}" "${{ matrix.exb-version }}" "$AUDIOM_ORIGINAL_URL"
        fi

    # Upload each version's build as an artifact; fail if there are no files.
    - name: Upload built widget artifact
      uses: actions/upload-artifact@v4
      with:
        name: audiom-${{ matrix.exb-version }}
        path: ${{ steps.widget-out.outputs.path }}
        if-no-files-found: error

  publish-docs:
    name: Publish builds to docs
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # Check out the branch tip (not the detached trigger SHA) so we can commit
    # and push the documentation update back to it.
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.ref_name }}

    # Download every version's build artifact.
    - name: Download all widget build artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: audiom-*

    # Fail if nothing was uploaded, or any artifact is empty / stamped wrong.
    - name: Verify downloaded artifacts
      run: bash "$SCRIPTS_DIR/verify-artifacts.sh" artifacts

    # Map each `audiom-<version>` artifact into its versioned docs folder.
    - name: Copy builds into docs
      run: bash "$SCRIPTS_DIR/copy-to-docs.sh" artifacts docs/builder-versions

    # Commit the refreshed builds and push the commit.
    - name: Commit and push documentation updates
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add docs/builder-versions
        if git diff --cached --quiet; then
          echo "No documentation changes to commit."
        else
          git commit -m "docs: Update Audiom widget builds."
          git push
        fi
