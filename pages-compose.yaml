services:
  jekyll:
    image: jekyll/jekyll:3.8
    container_name: docs-preview
    volumes:
    - ./docs:/srv/jekyll:rw
    - jekyll-bundle:/usr/local/bundle
    ports:
    - "4000:4000"
    command: jekyll serve --host 0.0.0.0 --force_polling --livereload
    environment:
    - JEKYLL_ENV=development

volumes:
  jekyll-bundle:
