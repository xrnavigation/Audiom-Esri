name: Build and Test

on:
  push:
    branches:
    - main
    - master
    - release/**
  pull_request:
    branches:
    - main
    - master
    - release/**
  workflow_dispatch:

env:
  NODE_VERSION: ${{ vars.NODE_VERSION && vars.NODE_VERSION || '20' }}

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install, test, and build
      run: |
        npm install
        npm test
        npm run build
