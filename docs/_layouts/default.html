<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    html {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    body {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    main {
      flex: 1;
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      box-sizing: border-box;
    }
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid #eee;
      color: #666;
      font-size: 14px;
    }
    footer a {
      color: #0366d6;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    {{ content }}
  </main>
  <footer>
    <p>&copy; 2026 <a href="https://xrnavigation.io">XR Navigation Inc.</a></p>
  </footer>
</body>
</html>
